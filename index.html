<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusOS Web</title><link rel="stylesheet" href="./styles.css"></head><body><div id="toast" class="toast"></div><div id="authView" class="auth-shell"><div class="auth-brand"><div class="brand-mark">C</div><div><strong>CampusOS</strong><span>Campus community</span></div></div><div class="auth-grid"><section class="hero-panel"><span class="eyebrow">CAMPUSOS WEB</span><h1>Your campus.<br><span>One connected space.</span></h1><p>Announcements, student pages, organizations and campus updates in one simple place.</p></section><section class="auth-card"><div class="auth-tabs"><button class="tab active" data-auth="login">Sign in</button><button class="tab" data-auth="signup">Create account</button></div><form id="authForm"><div id="signupFields" class="hidden"><label>Full name<input id="fullName" required></label><label>School ID<input id="schoolId"></label><label>Year & section<input id="yearSection"></label></div><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="6" required></label><button id="authSubmit" class="primary wide">Sign in</button><button id="resendBtn" class="text-btn hidden" type="button">Resend confirmation email</button></form><p id="authMessage" class="form-message"></p></section></div></div><div id="appView" class="app hidden"><aside class="sidebar"><div class="brand"><div class="brand-mark">C</div><div><strong>CampusOS</strong><span>Campus community</span></div></div><nav><button class="nav-item active" data-page="home">⌂ Home</button><button class="nav-item" data-page="announcements">◈ Announcements</button><button class="nav-item" data-page="people">◎ People & pages</button><button class="nav-item" data-page="profile">◯ My profile</button><button class="nav-item" onclick="openSettings()">⚙ Settings</button><button id="adminNav" class="nav-item hidden" data-page="admin">◆ Admin</button></nav><button id="signOut" class="nav-item">↪ Sign out</button></aside><main class="main"><header class="topbar"><span id="pageTitle">Home</span><div><button id="newAnnouncementTop" class="primary compact hidden" onclick="openAnnouncement()">＋ Announcement</button><button id="avatarButton" class="avatar">?</button></div></header><div class="content"><section id="page-home" class="page active"></section><section id="page-announcements" class="page"></section><section id="page-people" class="page"></section><section id="page-profile" class="page"></section><section id="page-admin" class="page"></section></div></main></div><div id="modal" class="modal hidden"><div class="modal-card"><button id="closeModal" class="modal-close">×</button><div id="modalContent"></div></div></div><script type="module" src="./app.js"></script></body></html>
